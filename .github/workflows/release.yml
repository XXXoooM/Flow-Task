name: Release

# 推送 v* 标签（如 v1.0.0）即触发：三平台构建 Tauri 安装包并上传到 GitHub Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'      # Apple Silicon + Intel（universal）
            target: 'universal-apple-darwin'
          - platform: 'windows-latest'    # .msi + NSIS .exe
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'      # .AppImage + .deb
            target: 'x86_64-unknown-linux-gnu'
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装跨平台编译工具（macOS universal）
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 准备 Node（npm）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 准备 Rust 工具链 + 缓存
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'FlowTask ${{ github.ref_name }}'
          releaseBody: '见 CHANGELOG.md。下载对应平台的安装包安装即可。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
